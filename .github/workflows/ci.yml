name: Miastro CI

on:
  push:
  pull_request:

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install native Avalonia dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-6 \
            libice6 \
            libsm6 \
            libfontconfig1

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Miastro.sln

      - name: Build
        run: dotnet build Miastro.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test
          tests/Miastro.Tests/Miastro.Tests.csproj
          -c Release
          --no-build

      - name: Publish linux-x64 self-contained
        run: >
          dotnet publish
          src/Miastro.UI.Avalonia/Miastro.UI.Avalonia.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -o artifacts/publish/linux-x64
          -p:DebugType=None
          -p:DebugSymbols=false
