name: Miastro CI

on:
  push:
  pull_request:

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install native Avalonia dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-6 \
            libice6 \
            libsm6 \
            libfontconfig1

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Miastro.sln

      - name: Build
        run: dotnet build Miastro.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test
          tests/Miastro.Tests/Miastro.Tests.csproj
          -c Release
          --no-build

      # MIASTRO_PHASE3_NATIVE_CI
      - name: Install Phase 3 native verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils xvfb

      - name: Restore linux-x64 runtime
        run: |
          dotnet restore src/Miastro.UI.Avalonia/Miastro.UI.Avalonia.csproj --runtime linux-x64

      - name: Publish linux-x64 self-contained
        run: |
          rm -rf artifacts/publish/fase3-linux-x64
          mkdir -p artifacts/publish/fase3-linux-x64
          dotnet publish src/Miastro.UI.Avalonia/Miastro.UI.Avalonia.csproj --configuration Release --runtime linux-x64 --self-contained true --no-restore --output artifacts/publish/fase3-linux-x64
      - name: Verify published Swiss Ephemeris resources
        run: |
          PUBLISH="artifacts/publish/fase3-linux-x64"
          test -x "$PUBLISH/Miastro.UI.Avalonia"
          test -f "$PUBLISH/native/linux-x64/libswe.so"
          test -f "$PUBLISH/native/linux-x64/native-manifest.json"
          test -f "$PUBLISH/ephemeris/manifest.json"
          test -f "$PUBLISH/ephemeris/sepl_18.se1"
          test -f "$PUBLISH/ephemeris/semo_18.se1"
          test -f "$PUBLISH/ephemeris/seas_18.se1"
          echo "PublishedSwissResources=PASS"
      - name: Build Phase 3 Debian package
        run: |
          PUBLISH_DIR="artifacts/publish/fase3-linux-x64"
          test -x "$PUBLISH_DIR/Miastro.UI.Avalonia"
          test -f "$PUBLISH_DIR/native/linux-x64/libswe.so"
          test -f "$PUBLISH_DIR/ephemeris/manifest.json"
          chmod +x tools/dev/build-fase3-deb.sh
          MIASTRO_PUBLISH_DIR="$PUBLISH_DIR" tools/dev/build-fase3-deb.sh
      - name: Install Phase 3 Debian package
        run: |
          DEB="$(find artifacts/deb -maxdepth 1 -name 'miastro_*_amd64.deb' -print -quit)"
          test -f "$DEB"
          sudo dpkg -i "$DEB"

      - name: Verify installed Swiss Ephemeris
        run: |
          chmod +x tools/dev/verify-fase3-installed.sh
          tools/dev/verify-fase3-installed.sh

      - name: Smoke installed application
        run: |
          set +e
          timeout 8s xvfb-run -a /usr/bin/miastro >/tmp/miastro-smoke.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            cat /tmp/miastro-smoke.log
            exit "$rc"
          fi
          echo "InstalledApplicationSmoke=PASS"
